name: release

# Builds the six backend services as linux/arm64 images and pushes them to
# GHCR, so the 2 GB t4g.small host only ever has to `docker pull`. Building
# with Maven on the instance itself would exhaust its memory.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        svc:
          - api-gateway
          - ms-users
          - ms-catalog
          - ms-contracts
          - ms-gamification
          - ms-notifications
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.svc }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/the-circle-${{ matrix.svc }}:latest
            ghcr.io/${{ github.repository_owner }}/the-circle-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
