# ============================================================================
# LOCAL / DEMO STACK ONLY — NOT a production deployment template.
# It pins SPRING_PROFILES_ACTIVE=local and sets AUTH_OTP_EXPOSE_DEV /
# OTP_EXPOSE_DEV=true, which return OTP codes in HTTP responses (E2E reads them
# from the JSON body). OtpExposureGuard permits this *because* the profile here
# is 'local'; it cannot protect a deployment that reuses this file. For staging/
# prod, use a separate compose/profile without these variables.
# ============================================================================
x-common: &common
  restart: unless-stopped
  networks: [thecircle]

x-app-env: &app-env
  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
  SPRING_PROFILES_ACTIVE: local
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}

# Local development stack: every microservice runs in a container with its port
# published to the host (8080-8085), so the Vite frontend can reach the gateway at
# http://localhost:8080/api directly. No Caddy / DuckDNS here — those are prod-only
# (see docker-compose.prod.yml). Replaces the old scr/init_the_circle.ps1 flow that
# launched each service with `mvn spring-boot:run` in its own window.
services:
  postgres:
    image: postgres:15-alpine
    container_name: thecircle-postgres
    <<: *common
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-thecircledb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: thecircle-opensearch
    <<: *common
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:9200/_cluster/health || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    <<: *common
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    container_name: thecircle-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      MS_USERS_URL: http://ms-users:8081
      MS_CATALOG_URL: http://ms-catalog:8082
      MS_CONTRACTS_URL: http://ms-contracts:8083
      MS_GAMIFICATION_URL: http://ms-gamification:8084
      MS_NOTIFICATIONS_URL: http://ms-notifications:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on: [ms-users, ms-catalog, ms-contracts, ms-gamification, ms-notifications]

  ms-users:
    <<: *common
    build: { context: ./backend, dockerfile: ms-users/Dockerfile }
    container_name: thecircle-ms-users
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      KYC_UPLOAD_DIR: /data/kyc
      AVATAR_UPLOAD_DIR: /data/avatars
      CATALOG_BASE_URL: http://ms-catalog:8082
      CONTRACTS_BASE_URL: http://ms-contracts:8083
      GAMIFICATION_BASE_URL: http://ms-gamification:8084
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY}
      CONTRACTS_INTERNAL_KEY: ${CONTRACTS_INTERNAL_KEY}
      NOTIFICATIONS_BASE_URL: http://ms-notifications:8085
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
      DEVICE_COOKIE_SECURE: "false"
      AUTH_OTP_EXPOSE_DEV: "true"
    volumes:
      - ./data/kyc:/data/kyc
      - ./data/avatars:/data/avatars
    depends_on:
      postgres: { condition: service_healthy }

  ms-catalog:
    <<: *common
    build: { context: ./backend, dockerfile: ms-catalog/Dockerfile }
    container_name: thecircle-ms-catalog
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      OPENSEARCH_URIS: http://opensearch:9200
      USERS_BASE_URL: http://ms-users:8081
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY}
    depends_on:
      opensearch: { condition: service_healthy }

  ms-contracts:
    <<: *common
    build: { context: ./backend, dockerfile: ms-contracts/Dockerfile }
    container_name: thecircle-ms-contracts
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contracts_db
      MS_USERS_URL: http://ms-users:8081
      MS_CATALOG_URL: http://ms-catalog:8082
      MS_NOTIFICATIONS_URL: http://ms-notifications:8085
      MS_GAMIFICATION_URL: http://ms-gamification:8084
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY}
      CONTRACTS_INTERNAL_KEY: ${CONTRACTS_INTERNAL_KEY}
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
      OTP_EXPOSE_DEV: "true"
    depends_on:
      postgres: { condition: service_healthy }

  ms-gamification:
    <<: *common
    build: { context: ./backend, dockerfile: ms-gamification/Dockerfile }
    container_name: thecircle-ms-gamification
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamification_db
    depends_on:
      postgres: { condition: service_healthy }

  ms-notifications:
    <<: *common
    build: { context: ./backend, dockerfile: ms-notifications/Dockerfile }
    container_name: thecircle-ms-notifications
    ports:
      - "8085:8085"
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications_db
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres_data:
  opensearch_data:

networks:
  thecircle:
    driver: bridge
