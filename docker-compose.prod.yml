x-common: &common
  restart: unless-stopped
  networks: [thecircle]

x-app-env: &app-env
  JAVA_TOOL_OPTIONS: "-Xmx96m -XX:MaxMetaspaceSize=96m -Xss256k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}

services:
  postgres:
    image: postgres:15-alpine
    container_name: thecircle-postgres
    <<: *common
    # Tuned down for a 2 GB host (t4g.small); defaults assume far more RAM.
    command: >
      postgres -c shared_buffers=64MB -c max_connections=60
               -c effective_cache_size=256MB -c work_mem=2MB
               -c maintenance_work_mem=32MB
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-thecircledb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: thecircle-opensearch
    <<: *common
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m"
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-api-gateway:latest
    container_name: thecircle-api-gateway
    environment:
      <<: *app-env
      MS_USERS_URL: http://ms-users:8081
      MS_CATALOG_URL: http://ms-catalog:8082
      MS_CONTRACTS_URL: http://ms-contracts:8083
      MS_GAMIFICATION_URL: http://ms-gamification:8084
      MS_NOTIFICATIONS_URL: http://ms-notifications:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on: [ms-users, ms-catalog, ms-contracts, ms-gamification, ms-notifications]

  ms-users:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-ms-users:latest
    container_name: thecircle-ms-users
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 25MB
      JWT_SECRET: ${JWT_SECRET}
      KYC_UPLOAD_DIR: /data/kyc
      AVATAR_UPLOAD_DIR: /data/avatars
      CATALOG_BASE_URL: http://ms-catalog:8082
      CONTRACTS_BASE_URL: http://ms-contracts:8083
      GAMIFICATION_BASE_URL: http://ms-gamification:8084
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY}
      CONTRACTS_INTERNAL_KEY: ${CONTRACTS_INTERNAL_KEY}
      NOTIFICATIONS_BASE_URL: http://ms-notifications:8085
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
      DEVICE_COOKIE_SECURE: "true"
      # Refresh-token cookie only over HTTPS (Caddy terminates TLS in prod).
      REFRESH_COOKIE_SECURE: "true"
    volumes:
      - ./data/kyc:/data/kyc
      - ./data/avatars:/data/avatars
    depends_on:
      postgres: { condition: service_healthy }

  ms-catalog:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-ms-catalog:latest
    container_name: thecircle-ms-catalog
    environment:
      <<: *app-env
      OPENSEARCH_URIS: http://opensearch:9200
      USERS_BASE_URL: http://ms-users:8081
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
    depends_on:
      opensearch: { condition: service_healthy }

  ms-contracts:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-ms-contracts:latest
    container_name: thecircle-ms-contracts
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contracts_db
      MS_USERS_URL: http://ms-users:8081
      MS_CATALOG_URL: http://ms-catalog:8082
      MS_NOTIFICATIONS_URL: http://ms-notifications:8085
      MS_GAMIFICATION_URL: http://ms-gamification:8084
      USERS_INTERNAL_KEY: ${USERS_INTERNAL_KEY}
      CATALOG_INTERNAL_KEY: ${CATALOG_INTERNAL_KEY}
      CONTRACTS_INTERNAL_KEY: ${CONTRACTS_INTERNAL_KEY}
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
    depends_on:
      postgres: { condition: service_healthy }

  ms-gamification:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-ms-gamification:latest
    container_name: thecircle-ms-gamification
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamification_db
    depends_on:
      postgres: { condition: service_healthy }

  ms-notifications:
    <<: *common
    image: ghcr.io/mavapegz/the-circle-ms-notifications:latest
    container_name: thecircle-ms-notifications
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications_db
      NOTIFICATIONS_INTERNAL_KEY: ${NOTIFICATIONS_INTERNAL_KEY}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    container_name: thecircle-caddy
    <<: *common
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api-gateway]

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: thecircle-duckdns
    environment:
      - SUBDOMAINS=the-circle
      - TOKEN=${DUCKDNS_TOKEN}
      - UPDATE_IP=ipv4
    restart: unless-stopped
    networks: [ thecircle ]

volumes:
  postgres_data:
  opensearch_data:
  caddy_data:
  caddy_config:

networks:
  thecircle:
    driver: bridge
