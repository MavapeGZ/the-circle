server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized
    gateway:
      enabled: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-users-auth
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/auth/**
        - id: ms-users
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/users/**
        - id: ms-catalog
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**
        - id: ms-contracts
          uri: http://localhost:8083
          predicates:
            - Path=/api/contracts/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG