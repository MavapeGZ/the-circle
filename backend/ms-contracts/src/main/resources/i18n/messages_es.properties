# --- REUNIDOS ---
contract.recitals.heading=REUNIDOS
contract.recital.partyA=De una parte, {0}, mayor de edad, con DNI/NIF {1} y domicilio en {2}, que actúa en su propio nombre y derecho (en adelante, la «Parte A»).
contract.recital.partyB=De otra parte, {0}, mayor de edad, con DNI/NIF {1} y domicilio en {2}, que actúa en su propio nombre y derecho (en adelante, la «Parte B»).
contract.recital.capacity=Ambas partes se reconocen mutuamente la capacidad legal necesaria para contratar y obligarse, y de forma libre

# --- EXPONEN (legitimación y causa del contrato) ---
contract.expound.heading=EXPONEN
contract.expound.purpose=I. Que la Parte A y la Parte B han convenido celebrar el presente contrato de {0} sobre el bien identificado en la cláusula primera, a través de la plataforma The Circle, que actúa únicamente como intermediario tecnológico facilitando el encuentro entre las partes y la firma electrónica del documento, sin ser parte del contrato.
contract.expound.legitimacy=II. Que la celebración de este contrato halla su legitimación en la libre voluntad y el consentimiento expreso de ambas partes, prestado de forma libre, específica, informada e inequívoca, en ejercicio de la autonomía de la voluntad reconocida por el ordenamiento jurídico y por el Derecho de la Unión Europea.
contract.expound.agreement=Que, reconociéndose ambas partes capacidad suficiente, acuerdan suscribir el presente contrato con arreglo a las siguientes

# --- CLÁUSULAS ---
contract.clauses.heading=CLÁUSULAS
contract.clause.object.title=Primera. Objeto del contrato
contract.clause.object.body=El objeto del presente contrato es la {0} del bien descrito en el apartado «Datos de la operación», en el estado y condiciones aquí pactados. Bien objeto del contrato: {1}.
contract.clause.price.title=Segunda. Precio y forma de pago
contract.clause.price.body=Las partes fijan como contraprestación el importe de {0}. El pago se gestiona, en su caso, a través de los medios habilitados por la plataforma, sirviendo el presente documento como justificante del acuerdo económico alcanzado entre las partes.
contract.clause.obligations.title=Tercera. Obligaciones de las partes
contract.clause.obligations.body=La Parte A se obliga a entregar el bien en el estado descrito, libre de cargas y gravámenes ocultos. La Parte B se obliga a recibirlo y, en su caso, a abonar el precio en los términos pactados. Ambas partes responden de la veracidad de los datos identificativos consignados en este documento.
contract.clause.dataprotection.title=Cuarta. Protección de datos personales
contract.clause.dataprotection.body=Los datos personales de las partes se tratan conforme al Reglamento (UE) 2016/679 (RGPD). La base de legitimación del tratamiento es la ejecución del presente contrato y el consentimiento de los interesados. Las partes podrán ejercer sus derechos de acceso, rectificación, supresión, oposición, limitación y portabilidad según lo previsto en la política de privacidad de la plataforma The Circle.
contract.clause.esignature.title=Quinta. Firma electrónica
contract.clause.esignature.body=Las partes aceptan firmar el presente contrato mediante firma electrónica avanzada, basada en la verificación de identidad por código de un solo uso (OTP), conforme al Reglamento (UE) n.º 910/2014 (eIDAS). Ambas partes reconocen a dicha firma plena validez y eficacia jurídica, equiparándola a la firma manuscrita a los efectos del artículo 25 del citado Reglamento.
contract.clause.law.title=Sexta. Ley aplicable y resolución de conflictos
contract.clause.law.body=El presente contrato se rige por la legislación aplicable en el Estado miembro de la Unión Europea de residencia de las partes. Para la resolución de cualquier controversia, las partes se someten a los juzgados y tribunales que resulten competentes conforme a la normativa de la Unión Europea, sin perjuicio de los derechos irrenunciables que asistan a los consumidores.

