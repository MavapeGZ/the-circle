# --- CLAUSES ---
contract.clauses.heading=CLAUSES
contract.clause.object.title=One. Purpose of the contract
contract.clause.object.body=The purpose of this contract is the {0} of the asset described in the "Transaction details" section, in the condition and on the terms agreed herein. Asset covered by the contract: {1}.
contract.clause.price.title=Two. Price and means of payment
contract.clause.price.body=The parties set the consideration at the amount of {0}. Payment is handled, where applicable, through the means provided by the platform, and this document serves as evidence of the financial agreement reached between the parties.
contract.clause.obligations.title=Three. Obligations of the parties
contract.clause.obligations.body=Party A undertakes to deliver the asset in the condition described, free of hidden liens and encumbrances. Party B undertakes to receive it and, where applicable, to pay the price on the agreed terms. Both parties are responsible for the accuracy of the identifying data stated in this document.
contract.clause.dataprotection.title=Four. Personal data protection
contract.clause.dataprotection.body=The parties' personal data are processed in accordance with Regulation (EU) 2016/679 (GDPR). The lawful basis for processing is the performance of this contract and the consent of the data subjects. The parties may exercise their rights of access, rectification, erasure, objection, restriction and portability as set out in the The Circle platform privacy policy.
contract.clause.esignature.title=Five. Electronic signature
contract.clause.esignature.body=The parties agree to sign this contract by means of an advanced electronic signature, based on identity verification through a one-time password (OTP), in accordance with Regulation (EU) No 910/2014 (eIDAS). Both parties recognise that signature as having full legal validity and effect, equivalent to a handwritten signature for the purposes of Article 25 of that Regulation.
contract.clause.law.title=Six. Governing law and dispute resolution
contract.clause.law.body=This contract is governed by the law applicable in the European Union Member State of the parties' residence. For the resolution of any dispute, the parties submit to the courts and tribunals having jurisdiction under European Union law, without prejudice to the non-waivable rights afforded to consumers.

