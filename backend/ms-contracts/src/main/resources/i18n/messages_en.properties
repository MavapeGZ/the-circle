contract.expound.purpose=I. That Party A and Party B have agreed to enter into this {0} contract over the asset identified in clause one, through the The Circle platform, which acts solely as a technological intermediary facilitating the parties' meeting and the electronic signature of the document, and is not a party to the contract.
