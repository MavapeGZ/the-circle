# Mirrors application-dev.properties so SPRING_PROFILES_ACTIVE=local works the same.
server.error.include-message=always
server.error.include-stacktrace=always
signature.otp.expose-in-response=true
# SMTP is optional for local E2E and must not block readiness. Kept to the local
# profile so a real deployment still surfaces a broken mail server via /health.
management.health.mail.enabled=false
