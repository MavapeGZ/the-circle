spring.application.name=ms-contracts

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:contracts_db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

# --- Inter-service clients ---
# ms-users base URL, used to enrich contracts with signer identity for the PDF.
services.users.base-url=${MS_USERS_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Advanced electronic signature (eIDAS firma avanzada via OTP) ---
signature.otp.length=6
signature.otp.ttl-seconds=600
signature.otp.max-attempts=5
signature.otp.expose-in-response=${OTP_EXPOSE_DEV:false}
signature.otp.cleanup-interval-ms=120000

# --- Email delivery (OTP) ---
# MAIL_HOST is REQUIRED in any environment where signature.otp.expose-in-response
# is false (i.e. staging/prod). With no SMTP host configured, /sign/request cannot
# deliver the OTP and responds 502 BAD_GATEWAY. For local dev without SMTP, set
# OTP_EXPOSE_DEV=true so the OTP is returned in the response instead of emailed.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
signature.mail.from=${MAIL_FROM:no-reply@thecircle.local}
signature.mail.subject=The Circle - Codigo de firma electronica
