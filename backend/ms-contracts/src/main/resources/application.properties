spring.application.name=ms-contracts

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:contracts_db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083
# Production-safe defaults: never expose stacktraces or internal messages over HTTP.
# application-dev.properties (loaded with SPRING_PROFILES_ACTIVE=dev) opts in.
server.error.include-message=never
server.error.include-stacktrace=never

# --- Inter-service clients ---
# ms-users base URL, used to enrich contracts with signer identity for the PDF.
services.users.base-url=${MS_USERS_URL:http://localhost:8081}
# Shared key for ms-users /internal endpoints. Must match USERS_INTERNAL_KEY in
# ms-users. Leave blank for local dev (guard disabled on both sides).
services.users.internal.api-key=${USERS_INTERNAL_KEY:}
# ms-catalog base URL + internal key, used to flip article availability
# (RESERVED/SOLD) as contracts progress. Key must match CATALOG_INTERNAL_KEY.
services.catalog.base-url=${MS_CATALOG_URL:http://localhost:8082}
services.catalog.internal.api-key=${CATALOG_INTERNAL_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Auth: shared JWT secret (same value as ms-users JWT_SECRET, base64). Used to
# verify the caller on PII-bearing contract PDF endpoints. Required at startup. ---
jwt.secret=${JWT_SECRET}

# --- Stale contract cleanup ---
# A contract is persisted (PENDING_SIGNATURES) when the buyer opens the signing
# screen; backing out without signing leaves an orphan row. This sweep deletes
# never-signed contracts older than the TTL.
contracts.pending-ttl-hours=${CONTRACTS_PENDING_TTL_HOURS:72}
contracts.pending-cleanup-interval-ms=${CONTRACTS_PENDING_CLEANUP_INTERVAL_MS:3600000}

# --- Simulated payment escrow ---
# How long buyer funds stay in escrow waiting for the seller to sign. After this
# the funds are refunded and the contract is cancelled.
payment.escrow.expiry-days=${PAYMENT_ESCROW_EXPIRY_DAYS:7}
# Refund sweep cadence. 10 minutes is plenty for a demo; raise/lower depending
# on how strict the timeout SLA needs to be.
payment.escrow.scan-interval-ms=${PAYMENT_ESCROW_SCAN_INTERVAL_MS:600000}

# --- Advanced electronic signature (eIDAS firma avanzada via OTP) ---
signature.otp.length=6
signature.otp.ttl-seconds=600
signature.otp.max-attempts=5
signature.otp.expose-in-response=${OTP_EXPOSE_DEV:false}
signature.otp.cleanup-interval-ms=120000

# --- OTP delivery channel ---
# Primary channel posts OTP emails to ms-notifications over HTTP. Override
# notifications.url to point at a remote ms-notifications instance and set
# notifications.api-key when ms-notifications has NOTIFICATIONS_INTERNAL_KEY
# configured (otherwise leave blank for local dev where the guard is off).
notifications.url=${MS_NOTIFICATIONS_URL:http://localhost:8085}
notifications.api-key=${NOTIFICATIONS_INTERNAL_KEY:}

# --- SMTP fallback (EmailOtpDelivery) ---
# Only loads when spring.mail.host is set. HttpOtpDelivery is @Primary, so
# this stays inactive unless you remove the HTTP channel. Useful when
# ms-notifications is not reachable in a given environment.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
signature.mail.from=${MAIL_FROM:no-reply@thecircle.local}
signature.mail.subject=The Circle - Electronic signature code
