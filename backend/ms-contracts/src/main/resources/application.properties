spring.application.name=ms-contracts

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:contracts_db}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# --- Advanced electronic signature (eIDAS firma avanzada via OTP) ---
signature.otp.length=6
signature.otp.ttl-seconds=600
signature.otp.max-attempts=5
signature.otp.expose-in-response=${OTP_EXPOSE_DEV:false}
signature.otp.cleanup-interval-ms=120000

# --- OTP delivery channel ---
# Primary channel posts OTP emails to ms-notifications over HTTP. Override
# notifications.url to point at a remote ms-notifications instance and set
# notifications.api-key when ms-notifications has NOTIFICATIONS_INTERNAL_KEY
# configured (otherwise leave blank for local dev where the guard is off).
notifications.url=${MS_NOTIFICATIONS_URL:http://localhost:8085}
notifications.api-key=${NOTIFICATIONS_INTERNAL_KEY:}

# --- SMTP fallback (EmailOtpDelivery) ---
# Only loads when spring.mail.host is set. HttpOtpDelivery is @Primary, so
# this stays inactive unless you remove the HTTP channel. Useful when
# ms-notifications is not reachable in a given environment.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
signature.mail.from=${MAIL_FROM:no-reply@thecircle.local}
signature.mail.subject=The Circle - Codigo de firma electronica
