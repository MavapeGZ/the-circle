server:
  port: 8081

spring:
  application:
    name: ms-users
  
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:users_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Secret key for JWT token generation and validation
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 day in milliseconds

kyc:
  upload-dir: ${KYC_UPLOAD_DIR:${user.home}/the-circle/uploads/users}
