server:
  port: 8081

spring:
  application:
    name: ms-users
  
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:thecircledb}
    username: ${DB_USER:thecircle}
    password: ${DB_PASSWORD:changeme}
