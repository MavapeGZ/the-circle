server:
  port: 8081

spring:
  application:
    name: ms-users
  
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:users_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Secret key for JWT token generation and validation
jwt:
  secret: ${JWT_SECRET}
  # Access-token lifetime in ms. Kept short (1h default) so a token leaked or
  # used after logout expires quickly; the expiry is embedded in the JWT, so
  # both ms-users and ms-contracts reject it once elapsed. The short TTL no
  # longer caps the session: the refresh-token flow below lets a client mint a
  # fresh access token without re-authenticating (see issue #89).
  expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds
  # Refresh-token lifetime in ms. This now caps the active session length: a
  # client can keep refreshing the access token until the refresh token expires.
  # Stored hashed in refresh_tokens and rotated on every use. Default 30 days.
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 days in milliseconds

kyc:
  upload-dir: ${KYC_UPLOAD_DIR:${user.home}/the-circle/uploads/users}

# Shared key guarding service-to-service endpoints under /internal/**.
# Blank disables the guard (local dev). Set USERS_INTERNAL_KEY in shared envs.
catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  internal:
    api-key: ${CATALOG_INTERNAL_KEY:}

contracts:
  base-url: ${CONTRACTS_BASE_URL:http://localhost:8083}
  internal:
    api-key: ${CONTRACTS_INTERNAL_KEY:}
    
users:
  internal:
    api-key: ${USERS_INTERNAL_KEY:}

notifications:
  base-url: ${NOTIFICATIONS_BASE_URL:http://localhost:8085}
  internal:
    api-key: ${NOTIFICATIONS_INTERNAL_KEY:}
  client:
    connect-timeout-ms: ${NOTIFICATIONS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${NOTIFICATIONS_READ_TIMEOUT_MS:30000}

gamification:
  base-url: ${GAMIFICATION_BASE_URL:http://localhost:8084}

signature:
  otp:
    length: ${OTP_LENGTH:6}
    ttl-seconds: ${OTP_TTL_SECONDS:600}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  mail:
    verify-subject: ${OTP_VERIFY_SUBJECT:The Circle - Verify your account}
    login-subject: ${OTP_LOGIN_SUBJECT:The Circle - Sign-in code}

auth:
  device:
    cookie:
      max-age-days: ${DEVICE_COOKIE_MAX_AGE_DAYS:90}
      secure: ${DEVICE_COOKIE_SECURE:false}
      secret: ${DEVICE_COOKIE_SECRET:${jwt.secret}}
  refresh:
    cookie:
      # Keep aligned with jwt.refresh-expiration (30 days). httpOnly + scoped to
      # /api/auth. Set REFRESH_COOKIE_SECURE=true behind HTTPS in production.
      max-age-days: ${REFRESH_COOKIE_MAX_AGE_DAYS:30}
      secure: ${REFRESH_COOKIE_SECURE:false}
